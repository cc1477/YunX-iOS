# XcodeGen 工程描述：在 macOS 上执行 `xcodegen generate` 生成 YunX.xcodeproj
name: YunX
options:
  bundleIdPrefix: com.yunx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  YunX:
    type: application
    platform: iOS
    sources:
      - path: YunX
    info:
      path: YunX/Info.plist
      properties:
        CFBundleDisplayName: 云析
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 下载目录在「文件」App 中可见：我的 iPhone › 云析
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: 将下载的图片和视频保存到相册
        # 各平台 CDN 偶有明文 http 直链（解析阶段已尽量升级为 https）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.yunx.ios
            CFBundleURLSchemes:
              - yunx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunx.ios
        PRODUCT_NAME: YunX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
