name: Cloudflare LCSign Distribution

on:
  workflow_call:
    inputs:
      sha256:
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: yunx-cloudflare-distribution
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cc1477/YunX-iOS
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify download handler
        run: node scripts/test_cloudflare_download.mjs

      - name: Fetch and verify the built IPA
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 300 https://cc1477.github.io/YunX-iOS/build-info.json -o source-build-info.json
          curl --fail --silent --show-error --retry 3 --max-time 300 https://cc1477.github.io/YunX-iOS/YunX-unsigned.ipa -o YunX.ipa
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from prepare_lcsign_site import prepare
          source = json.loads(Path('source-build-info.json').read_text())
          sha = hashlib.sha256(Path('YunX.ipa').read_bytes()).hexdigest()
          assert sha == source['sha256'] == os.environ['EXPECTED_SHA256'], 'Unexpected IPA checksum'
          url = f'https://yunx-lcsign-cc1477.pages.dev/ipa/{sha}/YunX-unsigned.ipa'
          prepare('YunX.ipa', 'site-lcsign', source['commit'], url)
          info_path = Path('site-lcsign/build-info.json')
          info = json.loads(info_path.read_text())
          assert all(info[key] == source[key] for key in ('version', 'build', 'bundle', 'size', 'sha256'))
          info['builtAt'] = source['builtAt']
          info_path.write_text(json.dumps(info, indent=2) + '\n')
          PY

      - name: Upload immutable IPA to R2
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/pubgtool-ipa/objects/ipa/yunx/${EXPECTED_SHA256}/YunX-unsigned.ipa" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/octet-stream' \
            -H 'Cache-Control: public, max-age=31536000, immutable' \
            --data-binary @YunX.ipa -o r2-upload.json
          python3 -c "import json; assert json.load(open('r2-upload.json'))['success']"

      - name: Install publishing CLI
        run: npm install -g wrangler@4 --no-fund --no-audit

      - name: Ensure YunX Pages project exists
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          base = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/pages/projects"
          headers = {'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type': 'application/json'}
          try:
              response = urllib.request.urlopen(urllib.request.Request(base + '/yunx-lcsign-cc1477', headers=headers), timeout=30)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              data = json.dumps({'name': 'yunx-lcsign-cc1477', 'production_branch': 'main'}).encode()
              response = urllib.request.urlopen(urllib.request.Request(base, data=data, headers=headers), timeout=30)
          assert json.load(response)['success']
          PY

      - name: Publish accelerated LCSign page
        run: wrangler pages deploy site-lcsign --project-name=yunx-lcsign-cc1477 --branch=main --commit-dirty=true

      - name: Verify public IPA
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 300 \
            "https://yunx-lcsign-cc1477.pages.dev/ipa/${EXPECTED_SHA256}/YunX-unsigned.ipa" -o public.ipa
          echo "${EXPECTED_SHA256}  public.ipa" | sha256sum --check
