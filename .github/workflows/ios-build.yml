name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version
          xcodebuild -version | awk 'NR == 2 { print "build=" $3 }' >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin Native compiler and dependency caches
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('gradle/libs.versions.toml', 'shared/build.gradle.kts') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Test shared code
        run: ./gradlew :shared:jvmTest --console=plain

      - name: Build iOS app (simulator, no code signing)
        working-directory: iosApp
        run: >
          xcodebuild -project iosApp.xcodeproj -scheme YunX
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build

      - name: Stop Gradle before simulator boot
        run: ./gradlew --stop

      - name: Launch app in an iPhone simulator
        run: >
          python3 iosApp/scripts/smoke-simulator.py
          iosApp/build/Build/Products/Debug-iphonesimulator/YunX.app
          iosApp/build/YunX-startup.png

      - name: Package simulator app
        working-directory: iosApp
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/YunX.app build/YunX-simulator.zip

      - name: Upload simulator app and startup screenshot
        uses: actions/upload-artifact@v4
        with:
          name: YunX-simulator
          path: |
            iosApp/build/YunX-simulator.zip
            iosApp/build/YunX-startup.png
          if-no-files-found: error
          retention-days: 7
