name: yunx
description: 云析 YunX —— 网盘 / 视频分享链接解析与下载（Flutter 版，移植自 CYQawa/YunX）
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  flutter_inappwebview: ^6.1.5
  path_provider: ^2.1.4
  video_player: ^2.9.2
  share_plus: ^10.1.2
  open_filex: ^4.5.0
  gal: ^2.3.0
  pointycastle: ^3.9.1
  cupertino_icons: ^1.0.8
  yunx_media:
    path: packages/yunx_media

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/app_logo.png

flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/app_icon.png
  remove_alpha_ios: true
