# 分发站点：取两个分支最新一次成功构建的 IPA → 组装站点 → 推送到 site-dist 分支
#
# site-dist 分支由 Cloudflare Workers Builds 连接（Git 集成，无需在 GitHub 里存 Cloudflare 令牌），
# 分支一更新 Cloudflare 就自动执行 `npx wrangler deploy`，经全球 CDN 分发。
# 该分支每次都是覆盖式的单个提交，仓库体积不会随版本增长。
name: Deploy Site

on:
  workflow_run:
    workflows: ["Build iOS", "Build Flutter iOS"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "cloudflare/**", "scripts/build_site.py", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yunx-site
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 下载两个分支最新的 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          fetch() { # 工作流名 分支 产物名 输出目录
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$1" --branch "$2" --status success --limit 1 --json databaseId -q '.[0].databaseId')
            sha=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)
            echo "$1@$2 → run $id ($sha)"
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$3" -D "$4"
            echo "$sha" > "$4/commit"
          }
          fetch "Build iOS" main YunX-unsigned-ipa in/swiftui
          fetch "Build Flutter iOS" flutter YunX-Flutter-unsigned-ipa in/flutter

      - name: 组装站点
        run: |
          # 绝对地址用 __BASE__/ 占位，由 Worker 在访问时替换成实际域名
          python3 scripts/build_site.py site dist/public "__BASE__/" \
            "swiftui=in/swiftui/YunX-unsigned.ipa=$(cat in/swiftui/commit)" \
            "flutter=in/flutter/YunX-Flutter-unsigned.ipa=$(cat in/flutter/commit)"
          cp cloudflare/worker.js cloudflare/wrangler.jsonc dist/
          cat > dist/README.md <<EOF
          # site-dist
          由 \`.github/workflows/deploy-site.yml\` 自动生成，请勿手动修改。来源提交：$GITHUB_SHA
          EOF
          find dist -type f | sort

      - name: 推送到 site-dist 分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist
          git init -q -b site-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "分发站点 $(date -u +%Y-%m-%dT%H:%MZ)（来源 ${GITHUB_SHA:0:7}）"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-dist
          echo "已推送 site-dist：$(git rev-parse --short HEAD)"
