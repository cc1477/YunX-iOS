name: iOS build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-build.yml', 'shared/**', 'iosApp/**', 'gradle/**', 'gradle.properties', 'build.gradle.kts', 'settings.gradle.kts', 'gradlew', 'gradlew.bat']
  workflow_dispatch:
    inputs:
      build_only:
        description: Compile and package the simulator application for a separate account test
        type: boolean
        default: false

concurrency:
  group: yunx-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version
          xcodebuild -version | awk 'NR == 2 { print "build=" $3 }' >> "$GITHUB_OUTPUT"

      - name: Restore Kotlin Native compiler and dependency caches
        id: konan_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-iosSimulatorArm64-v2-${{ hashFiles('gradle/libs.versions.toml', 'shared/build.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-iosSimulatorArm64-v2-
            konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Test shared code
        if: ${{ !inputs.build_only }}
        run: ./gradlew :shared:jvmTest --console=plain

      - name: Upload current shared test reports and Compose renders
        if: ${{ always() && !inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: YunX-ui-validation
          path: |
            shared/build/ui-layout
            shared/build/test-results/jvmTest
            shared/build/reports/tests/jvmTest
          if-no-files-found: error
          retention-days: 7

      - name: Build iOS app (simulator, no code signing)
        id: ios_build
        working-directory: iosApp
        run: >
          xcodebuild -project iosApp.xcodeproj -scheme YunX
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build

      - name: Stop Gradle before simulator boot
        if: always()
        run: ./gradlew --stop

      - name: Save Kotlin Native compiler and dependency caches
        if: always() && steps.konan_cache.outputs.cache-hit != 'true' && steps.ios_build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan_cache.outputs.cache-primary-key }}

      - name: Launch app in an iPhone simulator
        if: ${{ !inputs.build_only }}
        run: >
          python3 iosApp/scripts/smoke-simulator.py
          iosApp/build/Build/Products/Debug-iphonesimulator/YunX.app
          iosApp/build/YunX-startup.png

      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: YunX-startup-diagnostics
          path: |
            iosApp/build/YunX-startup.png
            iosApp/build/startup-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Package simulator app
        working-directory: iosApp
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/YunX.app build/YunX-simulator.zip

      - name: Upload simulator app and startup screenshot
        uses: actions/upload-artifact@v4
        with:
          name: YunX-simulator
          path: |
            iosApp/build/YunX-simulator.zip
            iosApp/build/YunX-startup*.png
          if-no-files-found: error
          retention-days: 7
