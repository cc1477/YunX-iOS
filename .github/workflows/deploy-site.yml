# 分发站点：取两个分支最新一次成功构建的 IPA → 组装站点 → 发布到 Cloudflare Pages（全球 CDN 加速）
#
# 需要在仓库 Settings › Secrets and variables › Actions 里添加：
#   CF_API_TOKEN   Cloudflare API 令牌（权限：Account › Cloudflare Pages › Edit）
#   CF_ACCOUNT_ID  Cloudflare 账户 ID
name: Deploy Site

on:
  workflow_run:
    workflows: ["Build iOS", "Build Flutter iOS"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "scripts/build_site.py", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: yunx-site
  cancel-in-progress: true

env:
  PROJECT: yunx-ios-cc1477

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 下载两个分支最新的 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          fetch() { # 工作流名 分支 产物名 输出目录
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$1" --branch "$2" --status success --limit 1 --json databaseId -q '.[0].databaseId')
            sha=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)
            echo "$1@$2 → run $id ($sha)"
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$3" -D "$4"
            echo "$sha" > "$4/commit"
          }
          fetch "Build iOS" main YunX-unsigned-ipa in/swiftui
          fetch "Build Flutter iOS" flutter YunX-Flutter-unsigned-ipa in/flutter
          ls -la in/*

      - name: 组装站点
        run: |
          python3 scripts/build_site.py site public "https://$PROJECT.pages.dev/" \
            "swiftui=in/swiftui/YunX-unsigned.ipa=$(cat in/swiftui/commit)" \
            "flutter=in/flutter/YunX-Flutter-unsigned.ipa=$(cat in/flutter/commit)"

      - name: 保存站点产物（便于预览）
        uses: actions/upload-artifact@v4
        with:
          name: yunx-site
          path: public

      - name: 检查 Cloudflare 凭证
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::请先在仓库 Secrets 中添加 CF_API_TOKEN 和 CF_ACCOUNT_ID"
            exit 1
          fi

      - name: 确保 Pages 项目存在
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          base = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/pages/projects"
          headers = {'Authorization': 'Bearer ' + os.environ['CF_API_TOKEN'], 'Content-Type': 'application/json'}
          project = os.environ['PROJECT']
          try:
              urllib.request.urlopen(urllib.request.Request(f'{base}/{project}', headers=headers), timeout=30)
              print('项目已存在：' + project)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              data = json.dumps({'name': project, 'production_branch': 'main'}).encode()
              result = json.load(urllib.request.urlopen(urllib.request.Request(base, data=data, headers=headers), timeout=30))
              assert result['success'], result
              print('已创建项目：' + project)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 发布到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: 校验线上文件
        run: |
          set -e
          site="https://$PROJECT.pages.dev"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$site/builds.json" -o live.json
          python3 - <<'PY'
          import hashlib, json, subprocess
          builds = json.load(open('live.json'))['builds']
          for b in builds:
              subprocess.run(['curl', '-fsS', '--retry', '5', '--retry-all-errors', '--retry-delay', '5', b['url'], '-o', 'check.ipa'], check=True)
              digest = hashlib.sha256(open('check.ipa', 'rb').read()).hexdigest()
              assert digest == b['sha256'], f"{b['id']} 校验失败"
              print(f"{b['id']} v{b['version']}({b['build']}) OK  {b['url']}")
          PY
          curl -fsS "$site/source.json" | python3 -c "import json,sys; print('软件源 apps:', len(json.load(sys.stdin)['apps']))"
          echo "站点：$site"
